<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Briga EV - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #34d399;
    }
    p {
      font-size: 1rem;
      color: #a1a1aa;
      max-width: 320px;
      line-height: 1.6;
    }
    .status {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 9999px;
      font-size: 0.875rem;
      color: #a1a1aa;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #34d399;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" rx="128" fill="#000000"/>
    <circle cx="256" cy="256" r="200" fill="#052e16" stroke="#10b981" stroke-width="12"/>
    <path d="M280 120L190 280H270L230 400L350 240H270L280 120Z" fill="#34d399"/>
  </svg>
  <h1>Briga EV</h1>
  <p>Anda sedang offline. Data perjalanan tetap direkam dan akan dikirim otomatis saat koneksi kembali.</p>
  <div class="status">
    <span class="spinner"></span>
    Menunggu koneksi...
  </div>
</body>
</html>
